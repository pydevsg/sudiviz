[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudiviz"
version = "0.3.0"
description = "Sufficient visibility into cloud infrastructure failures — live AWS topology + Terraform drift in one CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sudipto Ghosh" }]
requires-python = ">=3.10"
keywords = ["aws", "terraform", "observability", "networking", "diagnose", "alb", "vpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "typer>=0.15.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "graphviz>=0.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
tui = [
    "textual>=0.50.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
]
diagrams = [
    "diagrams>=0.23",
]
terraform = [
    "python-terraform>=0.10",
]
all = [
    "textual>=0.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "diagrams>=0.23",
    "python-terraform>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
sudiviz = "sudiviz.cli:app"

[project.urls]
Homepage = "https://github.com/pydevsg/sudiviz"
Issues = "https://github.com/pydevsg/sudiviz/issues"

[tool.setuptools.packages.find]
include = ["sudiviz*"]

[tool.setuptools.package-data]
sudiviz = ["web_templates/*.html", "web_templates/*.css", "web_templates/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
